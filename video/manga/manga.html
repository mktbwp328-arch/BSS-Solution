<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ปัญหาสินค้าค้างไลน์ผลิต — manga cut 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* Manga-style 9:16 cut of the same narration as video/cartoon. Deterministic
   like the others: render(f) sets every value from the frame number. Timing
   and audio are shared with the cartoon (../cartoon/timeline.js, audio.wav).
   No human figures — the look is carried by panels, speed lines, screentone,
   SFX lettering and the company's real photos run through a manga filter.
   Key content stays inside TikTok's safe area: below ~160px, above ~1500px. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a192f; }
#svg { position: absolute; inset: 0; }
#cap {
    position: absolute; left: 60px; right: 140px; top: 1340px;
    background: #fff; border: 7px solid #111; box-shadow: 10px 10px 0 #ff8c00;
    padding: 18px 28px 22px; font-family: 'Kanit', sans-serif; font-weight: 600;
    font-size: 46px; line-height: 1.32; color: #111; text-align: center;
}
</style>
<script src="../cartoon/timeline.js"></script>
</head>
<body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="tone" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff"/><circle cx="6" cy="6" r="2.6" fill="#111"/></pattern>
  <pattern id="toneD" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><circle cx="5" cy="5" r="3.7" fill="#111"/></pattern>
  <pattern id="toneO" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="12" height="12" fill="#ff8c00"/><circle cx="6" cy="6" r="2.4" fill="#b85500"/></pattern>
  <pattern id="toneN" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="12" height="12" fill="#0a192f"/><circle cx="6" cy="6" r="2.2" fill="#24456f"/></pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><circle cx="3.5" cy="3.5" r="1.9" fill="#000"/></pattern>
  <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="11" height="11" fill="#fff"/><path d="M0,0 L0,11" stroke="#111" stroke-width="3.5"/></pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#123a6b"/><path d="M48,0 L0,0 L0,48" fill="none" stroke="#3d6ea8" stroke-width="2"/></pattern>
  <!-- Real photos as manga panels: grey out, crush into four ink tones. A dot
       layer multiplied on top supplies the screentone texture. -->
  <filter id="manga" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 .38 .72 1"/><feFuncG type="discrete" tableValues="0 .38 .72 1"/><feFuncB type="discrete" tableValues="0 .38 .72 1"/>
    </feComponentTransfer>
  </filter>
</defs>
<g id="page"></g>
<g id="fx"></g>
</svg>
<div id="cap"><span id="capText"></span></div>

<script>
(function () {
'use strict';
const TL = window.TL;
const { FPS, TOTAL, BOX_EVERY, BOX_DELAY, BOX_MAX } = TL;
const W = 1080, H = 1920;
const INK = '#111', OR = '#ff8c00', NAVY = '#0a192f';

/* ------------------------------------------------------------- helpers */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const inv = (f, a, b) => clamp((f - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const outBack = t => { const c = 2.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pop = (l, a, d = 12) => outBack(inv(l, a, a + d));
const els = {};
const E = id => els[id] || (els[id] = document.getElementById(id));
const tf = (id, x, y, s = 1, r = 0) => { const e = E(id); if (e) e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(3)})`); };
const op = (id, v) => { const e = E(id); if (e) e.setAttribute('opacity', clamp(v, 0, 1).toFixed(3)); };
const at = (id, k, v) => { const e = E(id); if (e) e.setAttribute(k, v); };

const sceneById = id => TL.scenes.find(s => s.id === id);
const linesOf = id => TL.lines.filter(l => l.scene === id);
const lineAt = f => { for (let i = TL.lines.length - 1; i >= 0; i--) if (f >= TL.lines[i].from) return i; return -1; };

/* ----------------------------------------------------------- drawing */
const poly = pts => pts.map(p => p.join(',')).join(' ');

// a panel: outer group slides; inner group is clipped to the panel shape
function panel(id, pts, inner, fill = '#fff') {
    return `<g id="${id}"><clipPath id="${id}-c"><polygon points="${poly(pts)}"/></clipPath>
      <g clip-path="url(#${id}-c)"><polygon points="${poly(pts)}" fill="${fill}"/>${inner}</g>
      <polygon points="${poly(pts)}" fill="none" stroke="#fff" stroke-width="12"/>
      <polygon points="${poly(pts)}" fill="none" stroke="${INK}" stroke-width="5"/></g>`;
}

// a real photo, manga-filtered, with screentone multiplied over it
function photo(id, img, x, y, w, h) {
    return `<g id="${id}"><image href="../../images/works/${img}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" filter="url(#manga)"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#dots)" style="mix-blend-mode:multiply" opacity=".42"/></g>`;
}

// SFX lettering: heavy italic Kanit, ink outline, optional orange fill
const sfx = (id, text, size, fill = OR, rot = -8) =>
    `<g id="${id}"><text font-family="Kanit" font-style="italic" font-weight="900" font-size="${size}" text-anchor="middle"
      fill="${fill}" stroke="${INK}" stroke-width="${Math.round(size * .09)}" stroke-linejoin="round" paint-order="stroke" transform="rotate(${rot})">${text}</text></g>`;

// rectangular caption tag
const tag = (id, text, size = 44, fill = '#fff', color = INK) => {
    const w = text.length * size * .62 + 60;
    return `<g id="${id}"><rect x="${-w / 2}" y="${-size * .95}" width="${w}" height="${size * 1.4}" fill="${fill}" stroke="${INK}" stroke-width="6"/>
      <text font-family="Kanit" font-weight="800" font-size="${size}" text-anchor="middle" fill="${color}" y="${size * .1}">${text}</text></g>`;
};

const stamp = (id, text, size = 64, color = OR) =>
    `<g id="${id}"><rect x="${-text.length * size * .34 - 30}" y="${-size}" width="${text.length * size * .68 + 60}" height="${size * 1.45}" rx="10"
      fill="none" stroke="${color}" stroke-width="10"/><text font-family="Kanit" font-weight="900" font-size="${size}" text-anchor="middle" fill="${color}" y="${size * .15}">${text}</text></g>`;

// manga box: white face, hatched side, tape
const box = id => `<g id="${id}"><path d="M-48,-96 L48,-96 L48,0 L-48,0 Z" fill="#fff" stroke="${INK}" stroke-width="6"/>
  <path d="M48,-96 L66,-110 L66,-14 L48,0 Z" fill="url(#hatch)" stroke="${INK}" stroke-width="5"/>
  <path d="M-48,-96 L-30,-110 L66,-110 L48,-96 Z" fill="url(#tone)" stroke="${INK}" stroke-width="5"/>
  <rect x="-9" y="-96" width="18" height="30" fill="${OR}" stroke="${INK}" stroke-width="3"/></g>`;

function conveyor(id, len) {
    const n = Math.floor(len / 100) + 1;
    let r = '';
    for (let i = 0; i < n; i++) r += `<g id="${id}-r${i}" transform="translate(${30 + i * ((len - 60) / (n - 1))},-60)"><circle r="24" fill="#fff" stroke="${INK}" stroke-width="5"/><path d="M-16,0 L16,0 M0,-16 L0,16" stroke="${INK}" stroke-width="4"/></g>`;
    return `<g id="${id}"><path d="M24,-40 L14,60 M${len - 24},-40 L${len - 14},60 M${len / 2},-40 L${len / 2},60" stroke="${INK}" stroke-width="7"/>
      <rect x="0" y="-96" width="${len}" height="72" rx="36" fill="url(#toneD)" stroke="${INK}" stroke-width="6"/>${r}
      <path id="${id}-belt" d="M10,-92 L${len - 10},-92" stroke="${OR}" stroke-width="8" stroke-dasharray="24 20"/></g>`;
}
function spinConveyor(id, f, len, speed) {
    const n = Math.floor(len / 100) + 1;
    for (let i = 0; i < n; i++) at(`${id}-r${i}`, 'transform', `translate(${30 + i * ((len - 60) / (n - 1))},-60) rotate(${(f * speed * 7) % 360})`);
    at(id + '-belt', 'stroke-dashoffset', (-f * speed * 3).toFixed(1));
}

const clock = id => `<g id="${id}"><circle r="70" fill="#fff" stroke="${INK}" stroke-width="8"/><circle r="56" fill="url(#tone)"/>
  <path id="${id}-h" d="M0,0 L0,-50" stroke="${OR}" stroke-width="10" stroke-linecap="round"/><path id="${id}-m" d="M0,0 L32,0" stroke="${INK}" stroke-width="8" stroke-linecap="round"/><circle r="9" fill="${INK}"/></g>`;

function gear(id, r, teeth, label, fill) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {
        const a0 = i / (teeth * 2) * Math.PI * 2, a1 = (i + 1) / (teeth * 2) * Math.PI * 2, rr = i % 2 ? r : r + 28;
        d += (i ? 'L' : 'M') + (Math.cos(a0) * rr).toFixed(1) + ',' + (Math.sin(a0) * rr).toFixed(1) + ' L' + (Math.cos(a1) * rr).toFixed(1) + ',' + (Math.sin(a1) * rr).toFixed(1) + ' ';
    }
    return `<g id="${id}"><g id="${id}-rot"><path d="${d}Z" fill="${fill}" stroke="${INK}" stroke-width="7"/><circle r="${r * .45}" fill="#fff" stroke="${INK}" stroke-width="6"/></g>
      <text font-family="Kanit" font-weight="800" font-size="${Math.round(r * .3)}" text-anchor="middle" y="${r * .11}" fill="${INK}">${label}</text></g>`;
}

const flowMap = (id, labels) => `<g id="${id}">${labels.map((t, i) => `<g transform="translate(0,${i * 150})"><rect x="-170" y="-50" width="340" height="96" fill="#fff" stroke="${INK}" stroke-width="6"/>
  <text font-family="Kanit" font-weight="800" font-size="40" text-anchor="middle" y="14" fill="${INK}">${t}</text></g>${i < labels.length - 1 ? `<path d="M0,${i * 150 + 46} L0,${i * 150 + 100}" stroke="${OR}" stroke-width="10"/>` : ''}`).join('')}</g>`;

// radial speed lines; the pattern re-seeds every 2 frames so they flicker
function burst(cx, cy, n, r0, r1, w, color, seed) {
    let s = '';
    for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + (hash(i + seed) - .5) * .05;
        const rr = r0 + hash(i * 3 + seed) * 110;
        s += `M${(cx + Math.cos(a) * rr).toFixed(0)},${(cy + Math.sin(a) * rr).toFixed(0)} L${(cx + Math.cos(a) * r1).toFixed(0)},${(cy + Math.sin(a) * r1).toFixed(0)} `;
    }
    return `<path d="${s}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
}
const lines = (id) => `<g id="${id}"></g>`;
function setLines(id, f, cx, cy, n, r0, r1, w, color) { const e = E(id); if (e) e.innerHTML = burst(cx, cy, n, r0, r1, w, color, Math.floor(f / 2) * 17); }

// horizontal motion lines for things moving sideways
function setStreaks(id, f, y0, y1, color) {
    let s = '';
    const seed = Math.floor(f / 2) * 13;
    for (let i = 0; i < 26; i++) { const y = y0 + hash(i + seed) * (y1 - y0), x = hash(i * 7 + seed) * W; s += `M${x.toFixed(0)},${y.toFixed(0)} L${(x + 120 + hash(i + 3) * 260).toFixed(0)},${y.toFixed(0)} `; }
    E(id).innerHTML = `<path d="${s}" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`;
}

/* ------------------------------------------------------------- scenes */
// panel shapes, page coordinates (content band 150–1310)
const P_FULL = [[40, 150], [1040, 150], [1040, 1310], [40, 1310]];
const P_TOP = [[40, 150], [1040, 150], [1040, 640], [40, 720]];
const P_BOT = [[40, 750], [1040, 670], [1040, 1310], [40, 1310]];
const P_T3 = [[40, 150], [1040, 150], [1040, 500], [40, 540]];
const P_M3 = [[40, 570], [1040, 530], [1040, 900], [40, 920]];
const P_B3 = [[40, 950], [1040, 930], [1040, 1310], [40, 1310]];

const S = {};
const shakes = [];      // frames that kick the page

S.s0 = {
    svg: panel('s0-p', P_FULL, lines('s0-l') +
        `<g id="s0-t1">${sfx('s0-t1i', 'ปัญหา', 230, OR, -8)}</g><g id="s0-t2">${sfx('s0-t2i', 'สินค้าค้าง', 150, '#fff', -6)}</g><g id="s0-t3">${sfx('s0-t3i', 'ไลน์ผลิต!!', 170, '#fff', -6)}</g>`, INK),
    render(l, f) {
        setLines('s0-l', f, 540, 730, 160, 200, 1200, 7, '#fff');
        tf('s0-t1', 540, 520, pop(l, 2, 10) * (1 + Math.sin(l * .4) * .02));
        tf('s0-t2', 540, 760, pop(l, 14, 10));
        tf('s0-t3', 560, 980, pop(l, 26, 10));
    }
};

S.s1 = {
    svg: panel('s1-a', P_TOP, photo('s1-ph', 'conveyor-belt-factory.jpg', 40, 150, 1000, 580) + `<g id="s1-tg">${tag('s1-tgi', 'เครื่องจักรทันสมัย', 44)}</g>`) +
         panel('s1-b', P_BOT, lines('s1-l') +
            `<g transform="translate(540,1000)"><rect x="-400" y="-150" width="800" height="300" fill="#fff" stroke="${INK}" stroke-width="8"/>
             <text font-family="Kanit" font-weight="900" font-size="64" text-anchor="middle" y="-60" fill="${INK}">เป้าหมาย</text>
             <rect x="-340" y="0" width="680" height="70" fill="url(#tone)" stroke="${INK}" stroke-width="6"/>
             <rect id="s1-bar" x="-340" y="0" width="0" height="70" fill="${OR}" stroke="${INK}" stroke-width="6"/>
             <path d="M340,-20 L340,90" stroke="${INK}" stroke-width="10" stroke-dasharray="14 10"/></g>` +
            `<g id="s1-no">${sfx('s1-noi', 'ไม่ทัน!!', 200, OR, -12)}</g>`, '#fff'),
    render(l, f) {
        const L = linesOf('s1'), b = sceneById('s1').from, l2 = L[1].from - b;
        tf('s1-a', lerp(-1100, 0, outExpo(inv(l, 0, 14))), 0);
        tf('s1-ph', 0, 0, 1);
        at('s1-ph', 'transform', `translate(540,440) scale(${(1.15 - inv(l, 0, 300) * .1).toFixed(3)}) translate(-540,-440)`);
        tf('s1-tg', 330, 620, pop(l, 16));
        tf('s1-b', lerp(1100, 0, outExpo(inv(l, 10, 26))), 0);
        at('s1-bar', 'width', (680 * .68 * inv(l, 30, l2)).toFixed(0));
        const hit = l >= l2 + 8;
        if (hit) setLines('s1-l', f, 540, 1000, 120, 330, 1000, 6, INK); else E('s1-l').innerHTML = '';
        tf('s1-no', 560, 880, pop(l, l2 + 8, 8)); op('s1-no', l >= l2 + 8 ? 1 : 0);
    },
    shakes: () => { const L = linesOf('s1'); return [L[1].from + 8]; }
};

S.s2 = {
    svg: panel('s2-a', P_T3, photo('s2-pa', 'conveyor-system.jpg', 40, 150, 1000, 400) + `<g id="s2-sa">${stamp('s2-sai', 'ไม่ใช่เครื่องจักร', 56)}</g>`) +
         panel('s2-b', P_M3, photo('s2-pb', 'conveyor-belt-line.jpg', 40, 530, 1000, 400) + `<g id="s2-sb">${stamp('s2-sbi', 'ไม่ใช่คน', 64)}</g>`) +
         panel('s2-c', P_B3, lines('s2-l') + `<g id="s2-t">${sfx('s2-ti', 'แต่คือ "ระบบ"!!', 120, '#fff', -6)}</g>`, `url(#toneO)`),
    render(l, f) {
        const L = linesOf('s2'), b = sceneById('s2').from, l2 = L[1].from - b;
        tf('s2-a', lerp(1100, 0, outExpo(inv(l, 0, 14))), 0);
        tf('s2-sa', 540, 360, pop(l, 26, 8) * 1, -10); op('s2-sa', l >= 26 ? 1 : 0);
        tf('s2-b', lerp(-1100, 0, outExpo(inv(l, 30, 44))), 0);
        tf('s2-sb', 540, 740, pop(l, 54, 8), 8); op('s2-sb', l >= 54 ? 1 : 0);
        tf('s2-c', 0, lerp(800, 0, outExpo(inv(l, l2, l2 + 12))));
        setLines('s2-l', f, 540, 1130, 100, 160, 900, 6, INK);
        tf('s2-t', 540, 1170, pop(l, l2 + 10, 8));
    },
    shakes: () => { const b = sceneById('s2').from, L = linesOf('s2'); return [b + 26, b + 54, L[1].from + 10]; }
};

// pile slots (vertical page): a heap at the head of the conveyor
const PILE = [];
{ const rows = [5, 5, 4, 4, 3, 3, 2, 2, 1, 1]; rows.forEach((n, r) => { for (let i = 0; i < n; i++) PILE.push([150 + (r % 2) * 50 + i * 104 + (hash(r * 9 + i) - .5) * 12, 1180 - r * 94, (hash(r * 5 + i) - .5) * 16]); }); }

S.s3 = {
    svg: panel('s3-p', P_FULL, lines('s3-l') + conveyor('s3-cv', 520) +
        Array.from({ length: BOX_MAX }, (_, i) => box('s3-b' + i)).join('') + box('s3-ride') +
        `<g id="s3-slow">${tag('s3-slowi', 'ลำเลียงไม่ทัน...', 48)}</g>` +
        `<g id="s3-tun">${sfx('s3-tuni', 'ตึง!', 110, '#fff', -10)}</g><g id="s3-big">${sfx('s3-bigi', 'โครม!!', 210, OR, -12)}</g>`, '#fff'),
    render(l, f) {
        const sc = sceneById('s3'), L = linesOf('s3'), l2 = L[1].from - sc.from, l3 = L[2].from - sc.from;
        tf('s3-p', 0, lerp(1300, 0, outExpo(inv(l, 0, 14))));
        tf('s3-cv', 520, 1280); spinConveyor('s3-cv', f, 520, .15);
        let lastLand = -99;
        for (let k = 0; k < BOX_MAX; k++) {
            const spawn = sc.from + BOX_DELAY + k * BOX_EVERY, slot = PILE[k] || PILE[PILE.length - 1];
            if (f < spawn - 10) { tf('s3-b' + k, -500, 0, 0); continue; }
            const t = inv(f, spawn - 10, spawn);
            const x = lerp(-80, slot[0], t), y = lerp(500, slot[1], t) - Math.sin(t * Math.PI) * 220;
            const land = f >= spawn ? 1 - inv(f, spawn, spawn + 6) : 0;
            tf('s3-b' + k, x, y, 1 + land * .12, lerp(-160, slot[2], t));
            if (f >= spawn) lastLand = Math.max(lastLand, spawn);
        }
        tf('s3-ride', 600 + ((l * 1.1) % 420), 1184, .9, 0);
        tf('s3-slow', 780, 1050, pop(l, l2 + 6)); op('s3-slow', l >= l2 + 6 ? 1 : 0);
        const sinceLand = f - lastLand;
        tf('s3-tun', 820, 560 + hash(lastLand) * 200, sinceLand < 8 && l < l3 ? outBack(inv(sinceLand, 0, 6)) : 0, -10 + hash(lastLand) * 20);
        const big = l >= l3 + 30;
        if (big) setLines('s3-l', f, 400, 800, 140, 380, 1300, 7, INK); else E('s3-l').innerHTML = '';
        tf('s3-big', 600, 470, pop(l, l3 + 30, 8)); op('s3-big', big ? 1 : 0);
    },
    shakes: () => { const L = linesOf('s3'); return [L[2].from + 30]; }
};

S.s3b = {
    svg: panel('s3b-a', P_TOP, photo('s3b-ph', 'conveyor-company-chonburi.jpg', 40, 150, 1000, 580) + `<g id="s3b-st"></g>` +
            [0, 1, 2].map(i => `<g id="s3b-w${i}">${sfx('s3b-wi' + i, ['ยก!', 'ขยับ!', 'จัด!'][i], 120, i === 1 ? OR : '#fff', -8)}</g>`).join('')) +
         panel('s3b-b', P_BOT, lines('s3b-l') +
            `<g id="s3b-stop"><path d="M-150,-62 L-62,-150 L62,-150 L150,-62 L150,62 L62,150 L-62,150 L-150,62 Z" fill="${OR}" stroke="${INK}" stroke-width="10"/>
             <text font-family="Kanit" font-weight="900" font-size="96" text-anchor="middle" y="34" fill="#fff" stroke="${INK}" stroke-width="8" paint-order="stroke">หยุด!!</text></g>` +
            `<g id="s3b-wait">${tag('s3b-waiti', 'รอให้สินค้าเคลื่อนออกไปก่อน...', 40)}</g>`, `url(#toneD)`),
    render(l, f) {
        const sc = sceneById('s3b'), L = linesOf('s3b'), l2 = L[1].from - sc.from, ln = L[0].to - L[0].from;
        tf('s3b-a', lerp(-1100, 0, outExpo(inv(l, 0, 14))), 0);
        at('s3b-ph', 'transform', `translate(540,440) scale(${(1.1 + Math.sin(l * .9) * .01).toFixed(3)}) translate(-540,-440)`);
        setStreaks('s3b-st', f, 180, 700, '#fff');
        for (let i = 0; i < 3; i++) { const t0 = 8 + i * ln / 3; tf('s3b-w' + i, 220 + i * 320, 440 + (i % 2) * 120, pop(l, t0, 8)); op('s3b-w' + i, l >= t0 ? 1 : 0); }
        tf('s3b-b', lerp(1100, 0, outExpo(inv(l, l2 - 10, l2 + 4))), 0);
        const stop = l >= l2 + 27;
        if (stop) setLines('s3b-l', f, 540, 980, 120, 220, 900, 7, '#fff'); else E('s3b-l').innerHTML = '';
        tf('s3b-stop', 540, 960, pop(l, l2 + 27, 8) * (1 + (stop ? Math.sin(l * .8) * .02 : 0)), stop ? Math.sin(l * .5) * 3 : 0); op('s3b-stop', stop ? 1 : 0);

/* ------------------------------------------------------- page level */
function captions(f) {
    const i = lineAt(f), el = E('capText'), box = E('cap');
    if (i < 0 || f > TL.lines[i].to + 6) { box.style.opacity = 0; return; }
    const ln = TL.lines[i];
    const words = ln.text.split(' '), chunks = [];
    let cur = '';
    for (const w of words) { if ((cur + ' ' + w).trim().length > 30 && cur) { chunks.push(cur.trim()); cur = w; } else cur += ' ' + w; }
    if (cur.trim()) chunks.push(cur.trim());
    const total = chunks.reduce((a, c) => a + c.length, 0), p = inv(f, ln.from, ln.to) * total;
    let acc = 0, k = 0;
    for (; k < chunks.length - 1; k++) { acc += chunks[k].length; if (p < acc) break; }
    el.textContent = chunks[k];
    box.style.opacity = 1;
    // a small kick each time the caption changes, like a panel being turned
    const chunkStart = ln.from + (k ? chunks.slice(0, k).reduce((a, c) => a + c.length, 0) / total * (ln.to - ln.from) : 0);
    const d = f - chunkStart;
    box.style.transform = `rotate(${(-1 + (i % 2) * 2) * 1.2}deg) scale(${(1 + Math.exp(-Math.max(0, d) / 3) * .06).toFixed(3)})`;
}

let SHAKES = [];
function pageShake(f) {
    let s = 0;
    for (const k of SHAKES) { const d = f - k; if (d >= 0 && d < 10) s = Math.max(s, (1 - d / 10) * 18); }
    const dx = (hash(f) - .5) * 2 * s, dy = (hash(f + 50) - .5) * 2 * s;
    at('page', 'transform', `translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
}

function wipe(f) {
    // a thick orange slash with an ink edge cuts across on every scene change
    let html = '';
    for (const s of TL.scenes.slice(1)) {
        const d = f - s.from;
        if (d < -8 || d > 8) continue;
        const t = (d + 8) / 16, y = lerp(-900, 2400, inOut(t));
        html += `<polygon points="-50,${y - 520} 1130,${y - 860} 1130,${y} -50,${y + 340}" fill="${OR}" stroke="${INK}" stroke-width="14"/>`;
        if (Math.abs(d) <= 1) html += `<rect width="1080" height="1920" fill="#fff" opacity="${.5 - Math.abs(d) * .2}"/>`;
    }
    E('fx').innerHTML = html;
}

function build() {
    E('page').innerHTML = Object.entries(S).map(([id, s]) => `<g id="${id}" display="none">${s.svg}</g>`).join('');
    SHAKES = Object.values(S).flatMap(s => s.shakes ? s.shakes() : []).concat(TL.scenes.slice(1).map(s => s.from));
}

let last = null;
function render(f) {
    f = clamp(f, 0, TOTAL - 1);
    const sc = TL.scenes.find(s => f >= s.from && f < s.to) || TL.scenes[TL.scenes.length - 1];
    if (sc.id !== last) { Object.keys(S).forEach(id => at(id, 'display', id === sc.id ? 'inline' : 'none')); last = sc.id; }
    S[sc.id].render(f - sc.from, f, sc.to - sc.from);
    pageShake(f);
    wipe(f);
    captions(f);
}

build();
render(0);
window.__FPS = FPS; window.__TOTAL = TOTAL; window.__seek = render; window.__ready = true;
})();
