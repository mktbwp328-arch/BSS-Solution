<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ปัญหาสินค้าค้างไลน์ผลิต — line-art cut 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,800;1,900&family=Mali:wght@600;700&family=Sarabun:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Line-art 9:16 cut, derived from the manga page: thin even-weight lines,
   flat pastel fills, white page. Real photos are traced to line drawings by
   edge detection; alternate ones also get a flat pastel colour pass, the way
   the reference mixes line-only and coloured figures.
   Originally the manga-style 9:16 cut of the same narration as video/cartoon. Deterministic
   like the others: render(f) sets every value from the frame number. Timing
   and audio are shared with the cartoon (../cartoon/timeline.js, audio.wav).
   No human figures — the look is carried by panels, speed lines, screentone,
   SFX lettering and the company's real photos run through a manga filter.
   Key content stays inside TikTok's safe area: below ~160px, above ~1500px. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a192f; }
#svg { position: absolute; inset: 0; }
#cap {
    position: absolute; left: 70px; right: 130px; top: 1150px;
    padding: 0; font-family: 'Kanit', sans-serif; font-weight: 800;
    font-size: 72px; line-height: 1.2; color: #fff; text-align: center;
    -webkit-text-stroke: 14px #071224; paint-order: stroke fill;
    text-shadow: 0 8px 0 rgba(0,0,0,.35);
}
#cap .hot { color: #ffb000; font-size: 1.12em; }
#cap .hot2 { color: #ff7a1a; font-size: 1.12em; }

</style>
<script src="../cartoon/timeline.js"></script>
<script src="mascot.js"></script>
</head>
<body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Flat pastel fills under the old pattern ids, so the scene code is untouched -->
  <pattern id="tone" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eef1f6"/></pattern>
  <pattern id="toneD" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#6f95c2"/></pattern>
  <pattern id="toneO" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffc08a"/></pattern>
  <pattern id="toneN" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9eff7"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9c9a1"/></pattern>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#eef3fa"/><path d="M64,0 L0,0 L0,64" fill="none" stroke="#c9d6ea" stroke-width="2"/></pattern>
  <!-- Photo → line drawing: grey, soften, edge-detect, then invert into dark
       lines on white. Multiplied onto the page so the white drops out. -->
  <filter id="lineart" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feGaussianBlur stdDeviation="1.1"/>
    <feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="-7" intercept="1.05"/><feFuncG type="linear" slope="-7" intercept="1.05"/><feFuncB type="linear" slope="-6.4" intercept="1.08"/>
    </feComponentTransfer>
  </filter>
  <!-- Photo → flat pastel colour: soft saturation, few levels, lifted toward white -->
  <filter id="pastel" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values=".55"/>
    <feGaussianBlur stdDeviation="2.4"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues=".55 .72 .86 .97"/><feFuncG type="discrete" tableValues=".55 .72 .86 .97"/><feFuncB type="discrete" tableValues=".6 .76 .88 .98"/>
    </feComponentTransfer>
  </filter>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a192f"/><stop offset=".6" stop-color="#0d2342"/><stop offset="1" stop-color="#0a192f"/></linearGradient>
  <radialGradient id="spot"><stop offset="0" stop-color="#ff8a2b" stop-opacity=".42"/><stop offset=".55" stop-color="#ff8a2b" stop-opacity=".12"/><stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/></radialGradient>
  <pattern id="hazard" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="56" height="56" fill="#ffd23f"/><rect width="28" height="56" fill="#2a2a33"/></pattern>
  <!-- white rim around the narrator so it reads over photos -->
  <filter id="sticker" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="fat"/><feFlood flood-color="#ffffff"/><feComposite in2="fat" operator="in" result="rim"/><feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <!-- A faint hand tremor on every line -->
  <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence id="handNoise" type="fractalNoise" baseFrequency=".03" numOctaves="1" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g id="bgl"></g>
<g id="page"></g>
<g id="hud"></g>
<g id="fx"></g>
<!-- narrator: on top of everything, including the shutter -->
<!-- 640px tall, centred, feet on the bottom edge of the frame -->
<g id="avatarWrap" transform="translate(320,1292) scale(.4167)" filter="url(#sticker)"></g>
</svg>
<div id="cap"><span id="capText"></span></div>

<script>
(function () {
'use strict';
const TL = window.TL;
const { FPS, TOTAL, BOX_EVERY, BOX_DELAY, BOX_MAX } = TL;
const W = 1080, H = 1920;
// line colour, the brand orange softened to sit with pastels, and a pale blue
// ground where the manga used navy
const INK = '#2a2a33', OR = '#ff8a2b', NAVY = '#e9eff7';

/* ------------------------------------------------------------- helpers */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const inv = (f, a, b) => clamp((f - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
// Stamping press: nothing, then the die comes down oversized, bottoms out a
// touch under size, and seats. Used for every label, stamp and SFX word.
const outBack = t => {
    if (t <= 0) return 0;
    if (t < .5) { const k = t / .5; return 1.55 - .63 * (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2); }
    return .92 + .08 * (1 - Math.pow(1 - (t - .5) / .5, 3));
};
const outCubic = t => 1 - Math.pow(1 - t, 3);
// Carriage on a rail: accelerate, run, hit the end stop at 75% of the move,
// then a short damped rebound off the stop. Used for every panel slide.
const outExpo = t => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (t < .75) { const k = t / .75; return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
    const k = (t - .75) / .25;
    return 1 + Math.sin(k * Math.PI * 2) * .022 * (1 - k);
};
const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pop = (l, a, d = 12) => outBack(inv(l, a, a + d));
const els = {};
const E = id => els[id] || (els[id] = document.getElementById(id));
const tf = (id, x, y, s = 1, r = 0) => { const e = E(id); if (e) e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(3)})`); };
const op = (id, v) => { const e = E(id); if (e) e.setAttribute('opacity', clamp(v, 0, 1).toFixed(3)); };
const at = (id, k, v) => { const e = E(id); if (e) e.setAttribute(k, v); };

const sceneById = id => TL.scenes.find(s => s.id === id);
const linesOf = id => TL.lines.filter(l => l.scene === id);
const lineAt = f => { for (let i = TL.lines.length - 1; i >= 0; i--) if (f >= TL.lines[i].from) return i; return -1; };

/* ----------------------------------------------------------- drawing */
const poly = pts => pts.map(p => p.join(',')).join(' ');

// a panel: outer group slides; inner group is clipped to the panel shape
function panel(id, pts, inner, fill = '#fff') {
    return `<g id="${id}"><clipPath id="${id}-c"><polygon points="${poly(pts)}"/></clipPath>
      <g clip-path="url(#${id}-c)"><polygon points="${poly(pts)}" fill="${fill}"/>${inner}</g>
      <polygon points="${poly(pts)}" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/></g>`;
}

// a real photo, manga-filtered, with screentone multiplied over it
// The company's photos are shown exactly as shot. Only the frame around them
// is drawn: orange corner brackets, like a machine-vision inspection window.
function photo(id, img, x, y, w, h) {
    const c = (cx, cy, dx, dy) => `<path d="M${cx + dx * 60},${cy} L${cx},${cy} L${cx},${cy + dy * 60}" fill="none" stroke="${OR}" stroke-width="9" stroke-linecap="square"/>`;
    const m = 26;
    return `<g id="${id}"><image href="../../images/works/${img}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice"/>
      ${c(x + m, y + m, 1, 1)}${c(x + w - m, y + m, -1, 1)}${c(x + m, y + h - m, 1, -1)}${c(x + w - m, y + h - m, -1, -1)}</g>`;
}

// SFX lettering: heavy italic Kanit, ink outline, optional orange fill
const sfx = (id, text, size, fill = OR, rot = -8) =>
    `<g id="${id}"><text font-family="Mali" font-weight="700" font-size="${Math.round(size * .92)}" text-anchor="middle"
      fill="${fill === OR ? OR : INK}" stroke="#fff" stroke-width="${Math.round(size * .1)}" stroke-linejoin="round" paint-order="stroke" transform="rotate(${rot * .4})">${text}</text></g>`;

// rectangular caption tag
const tag = (id, text, size = 44, fill = '#fff', color = INK) => {
    const w = text.length * size * .62 + 60;
    return `<g id="${id}"><rect x="${-w / 2}" y="${-size * .95}" width="${w}" height="${size * 1.4}" rx="${size * .7}" fill="${fill}" stroke="${INK}" stroke-width="3.5"/>
      <text font-family="Mali" font-weight="700" font-size="${size}" text-anchor="middle" fill="${color}" y="${size * .1}">${text}</text></g>`;
};

const stamp = (id, text, size = 64, color = OR) =>
    `<g id="${id}"><rect x="${-text.length * size * .34 - 30}" y="${-size}" width="${text.length * size * .68 + 60}" height="${size * 1.45}" rx="10"
      fill="${color === OR ? '#ffe2c6' : '#dff3e6'}" stroke="${INK}" stroke-width="3.5"/><text font-family="Mali" font-weight="700" font-size="${size}" text-anchor="middle" fill="${INK}" y="${size * .15}">${text}</text></g>`;

// manga box: white face, hatched side, tape
const box = id => `<g id="${id}"><path d="M-48,-96 L48,-96 L48,0 L-48,0 Z" fill="#fff" stroke="${INK}" stroke-width="3.5"/>
  <path d="M48,-96 L66,-110 L66,-14 L48,0 Z" fill="url(#hatch)" stroke="${INK}" stroke-width="3.5"/>
  <path d="M-48,-96 L-30,-110 L66,-110 L48,-96 Z" fill="url(#tone)" stroke="${INK}" stroke-width="3.5"/>
  <rect x="-9" y="-96" width="18" height="30" fill="${OR}" stroke="${INK}" stroke-width="3"/></g>`;

function conveyor(id, len) {
    const n = Math.floor(len / 100) + 1;
    let r = '';
    for (let i = 0; i < n; i++) r += `<g id="${id}-r${i}" transform="translate(${30 + i * ((len - 60) / (n - 1))},-60)"><circle r="24" fill="#fff" stroke="${INK}" stroke-width="3.5"/><path d="M-16,0 L16,0 M0,-16 L0,16" stroke="${INK}" stroke-width="4"/></g>`;
    return `<g id="${id}"><path d="M24,-40 L14,60 M${len - 24},-40 L${len - 14},60 M${len / 2},-40 L${len / 2},60" stroke="${INK}" stroke-width="3.5"/>
      <rect x="0" y="-96" width="${len}" height="72" rx="36" fill="url(#toneD)" stroke="${INK}" stroke-width="3.5"/>${r}
      <path id="${id}-belt" d="M10,-92 L${len - 10},-92" stroke="${OR}" stroke-width="3.5" stroke-dasharray="24 20"/></g>`;
}
function spinConveyor(id, f, len, speed) {
    const n = Math.floor(len / 100) + 1;
    for (let i = 0; i < n; i++) at(`${id}-r${i}`, 'transform', `translate(${30 + i * ((len - 60) / (n - 1))},-60) rotate(${(f * speed * 7) % 360})`);
    at(id + '-belt', 'stroke-dashoffset', (-f * speed * 3).toFixed(1));
}

const clock = id => `<g id="${id}"><circle r="70" fill="#fff" stroke="${INK}" stroke-width="3.5"/><circle r="56" fill="url(#tone)"/>
  <path id="${id}-h" d="M0,0 L0,-50" stroke="${OR}" stroke-width="3.5" stroke-linecap="round"/><path id="${id}-m" d="M0,0 L32,0" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/><circle r="9" fill="${INK}"/></g>`;

function gear(id, r, teeth, label, fill) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {
        const a0 = i / (teeth * 2) * Math.PI * 2, a1 = (i + 1) / (teeth * 2) * Math.PI * 2, rr = i % 2 ? r : r + 28;
        d += (i ? 'L' : 'M') + (Math.cos(a0) * rr).toFixed(1) + ',' + (Math.sin(a0) * rr).toFixed(1) + ' L' + (Math.cos(a1) * rr).toFixed(1) + ',' + (Math.sin(a1) * rr).toFixed(1) + ' ';
    }
    return `<g id="${id}"><g id="${id}-rot"><path d="${d}Z" fill="${fill}" stroke="${INK}" stroke-width="3.5"/><circle r="${r * .45}" fill="#fff" stroke="${INK}" stroke-width="3.5"/></g>
      <text font-family="Kanit" font-weight="800" font-size="${Math.round(r * .3)}" text-anchor="middle" y="${r * .11}" fill="${INK}">${label}</text></g>`;
}

const flowMap = (id, labels) => `<g id="${id}">${labels.map((t, i) => `<g transform="translate(0,${i * 150})"><rect x="-170" y="-50" width="340" height="96" fill="#fff" stroke="${INK}" stroke-width="3.5"/>
  <text font-family="Kanit" font-weight="800" font-size="40" text-anchor="middle" y="14" fill="${INK}">${t}</text></g>${i < labels.length - 1 ? `<path d="M0,${i * 150 + 46} L0,${i * 150 + 100}" stroke="${OR}" stroke-width="3.5"/>` : ''}`).join('')}</g>`;

// radial speed lines; the pattern re-seeds every 2 frames so they flicker
function burst(cx, cy, n, r0, r1, w, color, seed) {
    let s = '';
    for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + (hash(i + seed) - .5) * .05;
        const rr = r0 + hash(i * 3 + seed) * 110;
        s += `M${(cx + Math.cos(a) * rr).toFixed(0)},${(cy + Math.sin(a) * rr).toFixed(0)} L${(cx + Math.cos(a) * r1).toFixed(0)},${(cy + Math.sin(a) * r1).toFixed(0)} `;
    }
    return `<path d="${s}" stroke="#c6d1e2" stroke-width="${(w * .45).toFixed(1)}" stroke-linecap="round" fill="none"/>`;
}
const lines = (id) => `<g id="${id}"></g>`;
function setLines(id, f, cx, cy, n, r0, r1, w, color) { const e = E(id); if (e) e.innerHTML = burst(cx, cy, n, r0, r1, w, color, Math.floor(f / 2) * 17); }

// horizontal motion lines for things moving sideways
function setStreaks(id, f, y0, y1, color) {
    let s = '';
    const seed = Math.floor(f / 2) * 13;
    for (let i = 0; i < 26; i++) { const y = y0 + hash(i + seed) * (y1 - y0), x = hash(i * 7 + seed) * W; s += `M${x.toFixed(0)},${y.toFixed(0)} L${(x + 120 + hash(i + 3) * 260).toFixed(0)},${y.toFixed(0)} `; }
    E(id).innerHTML = `<path d="${s}" stroke="${color}" stroke-width="3.5" stroke-linecap="round"/>`;
}

/* ------------------------------------------------------------- scenes */
// panel shapes, page coordinates (content band 150–1310)
const P_FULL = [[40, 150], [1040, 150], [1040, 1310], [40, 1310]];
const P_TOP = [[40, 150], [1040, 150], [1040, 640], [40, 720]];
const P_BOT = [[40, 750], [1040, 670], [1040, 1310], [40, 1310]];
const P_T3 = [[40, 150], [1040, 150], [1040, 500], [40, 540]];
const P_M3 = [[40, 570], [1040, 530], [1040, 900], [40, 920]];
const P_B3 = [[40, 950], [1040, 930], [1040, 1310], [40, 1310]];

const S = {};
const shakes = [];      // frames that kick the page

S.s0 = {
    svg: panel('s0-p', P_FULL, lines('s0-l') +
        `<g id="s0-t1">${sfx('s0-t1i', 'ปัญหา', 230, OR, -8)}</g><g id="s0-t2">${sfx('s0-t2i', 'สินค้าค้าง', 150, '#fff', -6)}</g><g id="s0-t3">${sfx('s0-t3i', 'ไลน์ผลิต!!', 170, '#fff', -6)}</g>`, '#fff6ec'),
    render(l, f) {
        setLines('s0-l', f, 540, 730, 160, 200, 1200, 7, '#fff');
        tf('s0-t1', 540, 520, pop(l, 2, 10) * (1 + Math.sin(l * .4) * .02));
        tf('s0-t2', 540, 760, pop(l, 14, 10));
        tf('s0-t3', 560, 980, pop(l, 26, 10));
    }
};

S.s1 = {
    svg: panel('s1-a', P_TOP, photo('s1-ph', 'conveyor-belt-factory.jpg', 40, 150, 1000, 580) + `<g id="s1-tg">${tag('s1-tgi', 'เครื่องจักรทันสมัย', 44)}</g>`) +
         panel('s1-b', P_BOT, lines('s1-l') +
            `<g transform="translate(540,1000)"><rect x="-400" y="-150" width="800" height="300" fill="#fff" stroke="${INK}" stroke-width="3.5"/>
             <text font-family="Kanit" font-weight="900" font-size="64" text-anchor="middle" y="-60" fill="${INK}">เป้าหมาย</text>
             <rect x="-340" y="0" width="680" height="70" fill="url(#tone)" stroke="${INK}" stroke-width="3.5"/>
             <rect id="s1-bar" x="-340" y="0" width="0" height="70" fill="${OR}" stroke="${INK}" stroke-width="3.5"/>
             <path d="M340,-20 L340,90" stroke="${INK}" stroke-width="3.5" stroke-dasharray="14 10"/></g>` +
            `<g id="s1-no">${sfx('s1-noi', 'ไม่ทัน!!', 200, OR, -12)}</g>`, '#fff'),
    render(l, f) {
        const L = linesOf('s1'), b = sceneById('s1').from, l2 = L[1].from - b;
        tf('s1-a', lerp(-1100, 0, outExpo(inv(l, 0, 14))), 0);
        tf('s1-ph', 0, 0, 1);
        at('s1-ph', 'transform', `translate(540,440) scale(${(1.15 - inv(l, 0, 300) * .1).toFixed(3)}) translate(-540,-440)`);
        tf('s1-tg', 330, 620, pop(l, 16));
        tf('s1-b', lerp(1100, 0, outExpo(inv(l, 10, 26))), 0);
        at('s1-bar', 'width', (680 * .68 * inv(l, 30, l2)).toFixed(0));
        const hit = l >= l2 + 8;
        if (hit) setLines('s1-l', f, 540, 1000, 120, 330, 1000, 6, INK); else E('s1-l').innerHTML = '';
        tf('s1-no', 560, 880, pop(l, l2 + 8, 8)); op('s1-no', l >= l2 + 8 ? 1 : 0);
    },
    shakes: () => { const L = linesOf('s1'); return [L[1].from + 8]; }
};

S.s2 = {
    svg: panel('s2-a', P_T3, photo('s2-pa', 'conveyor-system.jpg', 40, 150, 1000, 400) + `<g id="s2-sa">${stamp('s2-sai', 'ไม่ใช่เครื่องจักร', 56)}</g>`) +
         panel('s2-b', P_M3, photo('s2-pb', 'conveyor-belt-line.jpg', 40, 530, 1000, 400) + `<g id="s2-sb">${stamp('s2-sbi', 'ไม่ใช่คน', 64)}</g>`) +
         panel('s2-c', P_B3, lines('s2-l') + `<g id="s2-t">${sfx('s2-ti', 'แต่คือ "ระบบ"!!', 120, '#fff', -6)}</g>`, `url(#toneO)`),
    render(l, f) {
        const L = linesOf('s2'), b = sceneById('s2').from, l2 = L[1].from - b;
        tf('s2-a', lerp(1100, 0, outExpo(inv(l, 0, 14))), 0);
        tf('s2-sa', 540, 360, pop(l, 26, 8) * 1, -10); op('s2-sa', l >= 26 ? 1 : 0);
        tf('s2-b', lerp(-1100, 0, outExpo(inv(l, 30, 44))), 0);
        tf('s2-sb', 540, 740, pop(l, 54, 8), 8); op('s2-sb', l >= 54 ? 1 : 0);
        tf('s2-c', 0, lerp(1100, 0, outExpo(inv(l, l2, l2 + 12))));
        setLines('s2-l', f, 540, 1130, 100, 160, 900, 6, INK);
        tf('s2-t', 540, 1170, pop(l, l2 + 10, 8));
    },
    shakes: () => { const b = sceneById('s2').from, L = linesOf('s2'); return [b + 26, b + 54, L[1].from + 10]; }
};

// pile slots (vertical page): a heap at the head of the conveyor
const PILE = [];
{ const rows = [5, 5, 4, 4, 3, 3, 2, 2, 1, 1]; rows.forEach((n, r) => { for (let i = 0; i < n; i++) PILE.push([150 + (r % 2) * 50 + i * 104 + (hash(r * 9 + i) - .5) * 12, 1180 - r * 94, (hash(r * 5 + i) - .5) * 16]); }); }

S.s3 = {
    svg: panel('s3-p', P_FULL, lines('s3-l') + conveyor('s3-cv', 520) +
        Array.from({ length: BOX_MAX }, (_, i) => box('s3-b' + i)).join('') + box('s3-ride') +
        `<g id="s3-slow">${tag('s3-slowi', 'ลำเลียงไม่ทัน...', 48)}</g>` +
        `<g id="s3-tun">${sfx('s3-tuni', 'ตึง!', 110, '#fff', -10)}</g><g id="s3-big">${sfx('s3-bigi', 'โครม!!', 210, OR, -12)}</g>`, '#fff'),
    render(l, f) {
        const sc = sceneById('s3'), L = linesOf('s3'), l2 = L[1].from - sc.from, l3 = L[2].from - sc.from;
        tf('s3-p', 0, lerp(1300, 0, outExpo(inv(l, 0, 14))));
        tf('s3-cv', 520, 1280); spinConveyor('s3-cv', f, 520, .15);
        let lastLand = -99;
        for (let k = 0; k < BOX_MAX; k++) {
            const spawn = sc.from + BOX_DELAY + k * BOX_EVERY, slot = PILE[k] || PILE[PILE.length - 1];

// Words that carry the story get colour. Matched inside each chunk.
const HOT = ['ไม่ทัน', 'เป้าหมาย', 'ทันสมัย', 'เต็มที่', 'ระบบลำเลียง', 'ระบบ', 'ลำเลียง', 'สายพาน', 'Conveyor', 'ต่อเนื่อง',
    'กองใหญ่', 'สะสม', 'หยุด', 'รอ', 'เหนื่อย', 'ซ้ำๆ', 'เสียโอกาส', 'ภาพรวม', 'ขนาด', 'น้ำหนัก', 'ติดขัด', 'เหมาะสม',
    'ไหล', 'ภาระงาน', 'ทั้งไลน์', 'แท้จริง', 'ไม่เก่ง', 'ลงตัว', 'ร่วมกัน', 'ประสิทธิภาพ', 'ราบรื่น', 'ง่ายขึ้น',
    'บีเอสเอส', 'โซลูชั่น', 'เครื่องจักร', 'พนักงาน'];
const SEG = new Intl.Segmenter('th', { granularity: 'word' });
const CHUNK_MAX = 13;               // visible characters per caption — short, punchy
const chunkCache = {};
function chunksOf(text) {
    if (chunkCache[text]) return chunkCache[text];
    const out = [];
    let cur = '';
    for (const part of text.split(' ')) {
        for (const { segment } of SEG.segment(part)) {
            if (cur && (cur + segment).length > CHUNK_MAX) { out.push(cur); cur = ''; }
            cur += segment;
        }
        if (cur) { out.push(cur); cur = ''; }      // a written space is always a break
    }
    // fold tiny tails (a lone particle) back into the previous chunk
    const merged = [];
    for (const c of out) { if (merged.length && c.length <= 3) merged[merged.length - 1] += c; else merged.push(c); }
    return (chunkCache[text] = merged);
}
function highlight(chunk) {
    let html = chunk.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    const hits = HOT.filter(w => chunk.includes(w)).sort((a, b) => b.length - a.length);
    const used = [];
    for (const w of hits) {
        if (used.some(u => u.includes(w))) continue;    // "ระบบ" inside "ระบบลำเลียง" already coloured
        used.push(w);
        html = html.replace(w, `<span class="${used.length % 2 ? 'hot' : 'hot2'}">${w}</span>`);
    }
    return { html, hot: used.length > 0 };
}
let CAP = { key: '', start: 0, hot: false };
function captions(f) {
    const i = lineAt(f), el = E('capText'), box = E('cap');
    if (i < 0 || f > TL.lines[i].to + 6) { box.style.opacity = 0; CAP.key = ''; return; }
    const ln = TL.lines[i], chunks = chunksOf(ln.text);
    const total = chunks.reduce((a, c) => a + c.length, 0), p = inv(f, ln.from, ln.to) * total;
    let acc = 0, k = 0;
    for (; k < chunks.length - 1; k++) { acc += chunks[k].length; if (p < acc) break; }
    const before = chunks.slice(0, k).reduce((a, c) => a + c.length, 0);
    const start = Math.round(ln.from + before / total * (ln.to - ln.from));
    const key = i + ':' + k;
    if (key !== CAP.key) { const h = highlight(chunks[k]); el.innerHTML = h.html; CAP = { key, start, hot: h.hot }; }
    box.style.opacity = 1;
    const endCard = f >= TL.scenes[TL.scenes.length - 1].from;
    box.style.top = endCard ? '520px' : '1150px';
    // each chunk punches in: big, then settles
    const d = Math.max(0, f - start);
    const sc = d < 6 ? 1.28 - .28 * (1 - Math.pow(1 - d / 6, 3)) : 1;
    box.style.transform = `scale(${sc.toFixed(3)}) rotate(${(k % 2 ? 1.5 : -1.5)}deg)`;
}

let SHAKES = [];
function pageShake(f) {
    let s = 0;
    for (const k of SHAKES) { const d = f - k; if (d >= 0 && d < 12) s = Math.max(s, Math.cos(d / 12 * Math.PI * 2.5) * Math.exp(-d / 3.5) * 16); }
    // content scaled to 74% and anchored at the top: the lower third belongs to the narrator
    // content at full size again; the narrator stands below it at the frame edge
    at('page', 'transform', `translate(0,${s.toFixed(1)})`);
}

function wipe(f) {
    let html = '';
    for (const s of TL.scenes.slice(1)) {
        const d = f - s.from;
        if (d < -12 || d > 12) continue;
        // down over 12 frames to fully closed on the cut, then up over 12;
        // the same rail motion as the panels, so it stops with a clunk
        const closed = d <= 0 ? outExpo(inv(d, -12, 0)) : 1 - outExpo(inv(d, 0, 12));
        const bottom = closed * 1920;
        let slats = '';
        for (let y = bottom - 46; y > -46; y -= 46) slats += `M0,${y.toFixed(0)} L1080,${y.toFixed(0)} M0,${(y + 10).toFixed(0)} L1080,${(y + 10).toFixed(0)} `;
        html += `<rect x="0" y="0" width="1080" height="${bottom.toFixed(0)}" fill="#e3e8ef"/>
          <path d="${slats}" stroke="#b8c2cf" stroke-width="3"/>
          <rect x="0" y="${(bottom - 70).toFixed(0)}" width="1080" height="70" fill="url(#hazard)" stroke="${INK}" stroke-width="4"/>
          <rect x="470" y="${(bottom - 52).toFixed(0)}" width="140" height="34" rx="17" fill="#fff" stroke="${INK}" stroke-width="4"/>`;
    }
    E('fx').innerHTML = html;
}

// Background: navy shop floor — a panning blueprint grid, large gears turning
// in the corners (faster whenever something moves), drifting sparks, and an
// orange spotlight behind the narrator that swells as it talks.
function hud(f) {
    let busy = 0;
    for (const sc of TL.scenes.slice(1)) if (Math.abs(f - sc.from) < 16) busy = 1;
    for (const k of SHAKES) if (f - k >= 0 && f - k < 10) busy = Math.max(busy, .7);
    GEAR_A += 1.2 + busy * 9;
    const gx = (f * .6) % 60, gy = (f * .35) % 60;
    let grid = '';
    for (let x = -60 + gx; x < 1140; x += 60) grid += `M${x.toFixed(1)},0 L${x.toFixed(1)},1920 `;
    for (let y = -60 + gy; y < 1980; y += 60) grid += `M0,${y.toFixed(1)} L1080,${y.toFixed(1)} `;
    let sparks = '';
    for (let i = 0; i < 22; i++) {
        const t = ((f * (.6 + hash(i) * .8) + hash(i + 9) * 1920) % 1920);
        sparks += `<circle cx="${(hash(i * 3) * 1080 + Math.sin(f * .02 + i) * 30).toFixed(0)}" cy="${(1920 - t).toFixed(0)}" r="${(2 + hash(i + 2) * 4).toFixed(1)}" fill="#ff9a3c" opacity="${(.25 + hash(i + 5) * .45).toFixed(2)}"/>`;
    }
    const talk = TL.mouth[f] || 0;
    E('bgl').innerHTML = `
      <rect width="1080" height="1920" fill="url(#bgGrad)"/>
      <path d="${grid}" stroke="#13305a" stroke-width="2"/>
      <g transform="translate(-40,1180) rotate(${(GEAR_A * .5).toFixed(1)})">${gearPath(260, 16, '#16345f')}</g>
      <g transform="translate(1110,1330) rotate(${(-GEAR_A * .7).toFixed(1)})">${gearPath(200, 13, '#16345f')}</g>
      <g transform="translate(1040,120) rotate(${(GEAR_A * .35).toFixed(1)})">${gearPath(150, 11, '#122c52')}</g>
      <circle cx="540" cy="1640" r="${(380 + talk * 40).toFixed(0)}" fill="url(#spot)"/>
      ${sparks}`;
    E('hud').innerHTML = '';
}
let GEAR_A = 0;
function gearPath(r, teeth, col) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {
        const a0 = i / (teeth * 2) * Math.PI * 2, a1 = (i + 1) / (teeth * 2) * Math.PI * 2, rr = i % 2 ? r : r + 20;
        d += (i ? 'L' : 'M') + (Math.cos(a0) * rr).toFixed(1) + ',' + (Math.sin(a0) * rr).toFixed(1) + ' L' + (Math.cos(a1) * rr).toFixed(1) + ',' + (Math.sin(a1) * rr).toFixed(1) + ' ';
    }
    return `<path d="${d}Z" fill="none" stroke="${col}" stroke-width="10"/><circle r="${r * .35}" fill="none" stroke="${col}" stroke-width="10"/>`;
}

function build() {
    E('avatarWrap').innerHTML = window.MASCOT.svg;
    E('page').innerHTML = Object.entries(S).map(([id, s]) => `<g id="${id}" display="none">${s.svg}</g>`).join('');
    SHAKES = Object.values(S).flatMap(s => s.shakes ? s.shakes() : []).concat(TL.scenes.slice(1).map(s => s.from));
}

let last = null, LAST_F = -1;
// The narrator's face follows the story: worried through the problem,
// thinking through the design questions, pleased once the line flows.
const MOOD = { s0: 'neutral', s1: 'neutral', s2: 'neutral', s3: 'worried', s3b: 'worried', s4: 'worried',
               s5: 'think', s5b: 'think', s6: 'happy', s7: 'neutral', s7b: 'think', s8: 'happy', s9: 'happy' };
function narrator(f, id) {
    let mood = MOOD[id];
    const L = linesOf(id);
    if (id === 's1' && L.length && f >= L[L.length - 1].from) mood = 'worried';     // "...ยังผลิตไม่ทัน"
    if (id === 's7b' && L.length > 1 && f >= L[1].from + 40) mood = 'happy';      // pieces lock together
    let hop = 0;
    for (const k of SHAKES) { const d = f - k; if (d >= 0 && d < 12) hop = Math.max(hop, Math.sin(d / 12 * Math.PI)); }
    // A keyword chunk raises an arm, alternating sides, and lets it fall over
    // ~20 frames. Happy scenes wave both arms; worried ones hug in and fidget.
    let armL = 0, armR = 0;
    if (CAP.hot) { const dd = f - CAP.start, g = dd >= 0 && dd < 22 ? Math.sin(Math.min(1, dd / 5) * Math.PI / 2) * (1 - Math.max(0, dd - 8) / 14) : 0;
                   if (CAP.key.endsWith('0') || CAP.key.endsWith('2') || CAP.key.endsWith('4')) armR = 38 * g; else armL = 38 * g; }
    if (mood === 'happy') { armL = Math.max(armL, 26 + Math.sin(f * .35) * 12); armR = Math.max(armR, 26 + Math.cos(f * .35) * 12); }
    if (mood === 'worried') { armL += -4 + Math.sin(f * .9) * 1.5; armR += -4 + Math.cos(f * .9) * 1.5; }
    if (mood === 'think') armR = Math.max(armR, 14);
    window.MASCOT.pose(f, { talk: TL.mouth[f] || 0, hop: hop * .5, armL, armR, dance: mood === 'happy' ? 1 : 0,
        enter: outExpo(inv(f, 6, 30)) });
}
// same busy test as hud(), used to rebuild the gear angle after a seek
function gearBusy(f) {
    let b = 0;
    for (const s of TL.scenes.slice(1)) if (Math.abs(f - s.from) < 16) b = 1;
    for (const k of SHAKES) if (f - k >= 0 && f - k < 10) b = Math.max(b, .7);
    return b;
}
function render(f) {
    f = clamp(f, 0, TOTAL - 1);
    const sc = TL.scenes.find(s => f >= s.from && f < s.to) || TL.scenes[TL.scenes.length - 1];
    if (sc.id !== last) { Object.keys(S).forEach(id => at(id, 'display', id === sc.id ? 'inline' : 'none')); last = sc.id; }
    S[sc.id].render(f - sc.from, f, sc.to - sc.from);
    pageShake(f);
    if (f < LAST_F || f - LAST_F > 1) { GEAR_A = 0; for (let g = 0; g < f; g++) GEAR_A += 1.2 + gearBusy(g) * 9; }
    LAST_F = f;
    wipe(f);
    hud(f);
    narrator(f, sc.id);
    captions(f);
}

build();
render(0);
window.__FPS = FPS; window.__TOTAL = TOTAL; window.__seek = render; window.__ready = true;
})();
</script>
</body>
</html>
