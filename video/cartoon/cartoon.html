<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ปัญหาสินค้าค้างไลน์ผลิต — BSS SOLUTION</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Doodle-style explainer. Like scene.html it is fully deterministic: every
   value is a function of the frame number, set by render(f). Timing comes
   from timeline.js, which build-audio.js writes from the measured voice. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a192f; font-family: 'Mali', 'Leelawadee UI', sans-serif; }
#svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.ink   { stroke: #071224; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.thin  { stroke: #071224; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
.txt   { font-family: 'Mali', sans-serif; font-weight: 700; }
#subs {
    position: absolute; left: 0; right: 0; bottom: 46px; text-align: center;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.3; color: #fff;
    -webkit-text-stroke: 10px #071224; paint-order: stroke fill;
}
#subs span { display: inline-block; padding: 4px 26px 8px; }
</style>
<script src="timeline.js"></script>
</head>
<body>
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <!-- Line boil + sticker halo. The turbulence seed changes every few
             frames, so every outline wobbles like it was redrawn by hand; the
             dilated white rim keeps dark ink readable on the navy page. -->
        <filter id="doodle" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="wob"/>
            <feMorphology in="wob" operator="dilate" radius="5" result="fat"/>
            <feFlood flood-color="#ffffff" result="white"/>
            <feComposite in="white" in2="fat" operator="in" result="halo"/>
            <feMerge><feMergeNode in="halo"/><feMergeNode in="wob"/></feMerge>
        </filter>
        <clipPath id="photoClip"><rect x="-150" y="-110" width="300" height="220"/></clipPath>
    </defs>
    <g id="bg"></g>
    <g id="cam"><g id="world" filter="url(#doodle)"></g></g>
    <g id="fxTop"></g>
    <g id="wipe"></g>
</svg>
<div id="subs"><span id="subText"></span></div>

<script>
(function () {
'use strict';
const TL = window.TL;
const { FPS, TOTAL, BOX_EVERY, BOX_DELAY, BOX_MAX } = TL;

/* ------------------------------------------------------------- helpers */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const inv = (f, a, b) => clamp((f - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const outBack = t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outElastic = t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pop = (l, a, d = 14) => outBack(inv(l, a, a + d));     // 0 → 1 with overshoot
const $ = id => document.getElementById(id);
const els = {};
const E = id => els[id] || (els[id] = document.getElementById(id));
function tf(id, x, y, s = 1, r = 0, sx = 1, sy = 1) {
    const e = E(id); if (!e) return;
    e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${(s * sx).toFixed(3)},${(s * sy).toFixed(3)})`);
}
function op(id, v) { const e = E(id); if (e) e.setAttribute('opacity', clamp(v, 0, 1).toFixed(3)); }
function at(id, k, v) { const e = E(id); if (e) e.setAttribute(k, v); }

const ORANGE = '#ff8c00', ORANGE2 = '#ffb347', NAVY = '#0a192f', NAVY2 = '#1d3a5f', INK = '#071224', CARD = '#ffd9a6';

const lineAt = f => { for (let i = TL.lines.length - 1; i >= 0; i--) if (f >= TL.lines[i].from) return i; return -1; };
const sceneById = id => TL.scenes.find(s => s.id === id);
const linesOf = id => TL.lines.filter(l => l.scene === id);
const mouthAt = f => TL.mouth[clamp(f, 0, TOTAL - 1)] || 0;
const talking = f => { const i = lineAt(f); return i >= 0 && f <= TL.lines[i].to; };

/* ---------------------------------------------------------- characters */

// Narrator mascot "น้องบีเอส": white body, orange hard hat, BSS badge.
function mascotSVG(p) {
    return `
<g id="${p}">
  <g id="${p}-legL"><path class="ink" d="M-45,-48 L-52,-4" fill="none"/><ellipse class="ink" cx="-60" cy="0" rx="30" ry="14" fill="${NAVY2}"/></g>
  <g id="${p}-legR"><path class="ink" d="M45,-48 L52,-4" fill="none"/><ellipse class="ink" cx="60" cy="0" rx="30" ry="14" fill="${NAVY2}"/></g>
  <g id="${p}-body">
    <g id="${p}-armL"><path class="ink" d="M-104,-150 Q-160,-120 -175,-75" fill="none"/><circle class="ink" cx="-178" cy="-70" r="20" fill="#fff"/></g>
    <g id="${p}-armR"><path class="ink" d="M104,-150 Q160,-120 175,-75" fill="none"/><circle class="ink" cx="178" cy="-70" r="20" fill="#fff"/></g>
    <rect class="ink" x="-110" y="-262" width="220" height="220" rx="58" fill="#fff"/>
    <path class="thin" d="M-72,-70 L-72,-52 M72,-70 L72,-52" fill="none"/>
    <rect class="thin" x="-46" y="-100" width="92" height="38" rx="10" fill="${ORANGE}"/>
    <text class="txt" x="0" y="-72" font-size="26" text-anchor="middle" fill="#fff">BSS</text>
    <g id="${p}-head">
      <path class="ink" d="M-104,-232 Q-104,-322 0,-326 Q104,-322 104,-232 Z" fill="${ORANGE}"/>
      <path class="ink" d="M-126,-230 L126,-230" fill="none"/>
      <path class="thin" d="M0,-322 L0,-270" fill="none"/>
      <ellipse class="ink" cx="-40" cy="-178" rx="25" ry="31" fill="#fff"/>
      <ellipse class="ink" cx="40" cy="-178" rx="25" ry="31" fill="#fff"/>
      <circle id="${p}-pl" cx="-36" cy="-174" r="11" fill="${INK}"/>
      <circle id="${p}-pr" cx="44" cy="-174" r="11" fill="${INK}"/>
      <rect id="${p}-lidL" x="-68" y="-212" width="56" height="0" fill="#fff" class="thin"/>
      <rect id="${p}-lidR" x="12" y="-212" width="56" height="0" fill="#fff" class="thin"/>
      <path id="${p}-brL" class="ink" d="M-62,-220 L-20,-214" fill="none"/>
      <path id="${p}-brR" class="ink" d="M20,-214 L62,-220" fill="none"/>
      <ellipse class="thin" cx="-74" cy="-136" rx="14" ry="8" fill="${ORANGE2}" opacity=".7"/>
      <ellipse class="thin" cx="74" cy="-136" rx="14" ry="8" fill="${ORANGE2}" opacity=".7"/>
      <ellipse id="${p}-mouth" class="ink" cx="0" cy="-128" rx="26" ry="6" fill="#5a1520"/>
    </g>
  </g>
</g>`;
}

/* pose: talk 0..1, wave (arm swing), armL/armR in degrees, tilt, bounce px, sq (squash), blink */
function poseMascot(p, f, o) {
    const { x, y, s = 1, talk = 0, armL = 10, armR = -10, tilt = 0, bounce = 0, sq = 1, look = 0, brow = 0, walk = 0 } = o;
    tf(p, x, y - bounce, s, 0, 1 / Math.sqrt(sq), sq);
    at(p + '-body', 'transform', `rotate(${tilt} 0 -40)`);
    at(p + '-armL', 'transform', `rotate(${armL} -104 -150)`);
    at(p + '-armR', 'transform', `rotate(${armR} 104 -150)`);
    at(p + '-legL', 'transform', `rotate(${walk ? Math.sin(f * .5) * 22 : 0} -45 -48)`);
    at(p + '-legR', 'transform', `rotate(${walk ? -Math.sin(f * .5) * 22 : 0} 45 -48)`);
    at(p + '-mouth', 'ry', (5 + talk * 26).toFixed(1));
    at(p + '-mouth', 'rx', (24 + talk * 6).toFixed(1));
    // blink every ~3.3s, offset per character so they never blink in unison
    const ph = (f + p.length * 37) % 100, b = ph < 3 ? 1 - Math.abs(ph - 1.5) / 1.5 : 0;
    at(p + '-lidL', 'height', (b * 62).toFixed(1)); at(p + '-lidR', 'height', (b * 62).toFixed(1));
    at(p + '-pl', 'cx', -36 + look * 9); at(p + '-pr', 'cx', 44 + look * 9);
    at(p + '-brL', 'transform', `translate(0 ${-brow * 10}) rotate(${brow * -8} -40 -217)`);
    at(p + '-brR', 'transform', `translate(0 ${-brow * 10}) rotate(${brow * 8} 40 -217)`);
}

// Factory worker: hard hat, vest.
function workerSVG(p) {
    return `
<g id="${p}">
  <g id="${p}-legL"><path class="ink" d="M-26,-60 L-30,-6" fill="none"/><ellipse class="ink" cx="-36" cy="-2" rx="22" ry="11" fill="${INK}"/></g>
  <g id="${p}-legR"><path class="ink" d="M26,-60 L30,-6" fill="none"/><ellipse class="ink" cx="36" cy="-2" rx="22" ry="11" fill="${INK}"/></g>
  <g id="${p}-body">
    <g id="${p}-armL"><path class="ink" d="M-58,-150 L-92,-90" fill="none"/><circle class="ink" cx="-95" cy="-84" r="15" fill="#fff"/></g>
    <g id="${p}-armR"><path class="ink" d="M58,-150 L92,-90" fill="none"/><circle class="ink" cx="95" cy="-84" r="15" fill="#fff"/></g>
    <rect class="ink" x="-60" y="-178" width="120" height="124" rx="30" fill="${NAVY2}"/>
    <path class="thin" d="M-38,-176 L-38,-56 M38,-176 L38,-56" stroke="${ORANGE}" stroke-width="12"/>
    <path class="thin" d="M-60,-112 L60,-112" stroke="#fff" stroke-width="8"/>
    <g id="${p}-head">
      <circle class="ink" cx="0" cy="-232" r="56" fill="#fff"/>
      <path class="ink" d="M-58,-246 Q-56,-306 0,-308 Q56,-306 58,-246 Z" fill="${ORANGE}"/>
      <path class="ink" d="M-74,-246 L74,-246" fill="none"/>
      <circle cx="-20" cy="-226" r="7" fill="${INK}"/><circle cx="20" cy="-226" r="7" fill="${INK}"/>
      <path id="${p}-mouth" class="thin" d="M-16,-202 Q0,-188 16,-202" fill="none"/>
      <g id="${p}-sweat" opacity="0"><path class="thin" d="M50,-262 Q62,-240 50,-232 Q38,-240 50,-262 Z" fill="#7fd3ff"/><path class="thin" d="M66,-226 Q74,-212 66,-206 Q58,-212 66,-226 Z" fill="#7fd3ff"/></g>
    </g>
  </g>
</g>`;
}
function poseWorker(p, f, o) {
    const { x, y, s = 1, armL = 15, armR = -15, tilt = 0, bounce = 0, mood = 'ok', sweat = 0, walk = 0, sq = 1 } = o;
    tf(p, x, y - bounce, s, 0, 1 / Math.sqrt(sq), sq);
    at(p + '-body', 'transform', `rotate(${tilt} 0 -60)`);
    at(p + '-armL', 'transform', `rotate(${armL} -58 -150)`);
    at(p + '-armR', 'transform', `rotate(${armR} 58 -150)`);
    at(p + '-legL', 'transform', `rotate(${walk ? Math.sin(f * .55) * 25 : 0} -26 -60)`);
    at(p + '-legR', 'transform', `rotate(${walk ? -Math.sin(f * .55) * 25 : 0} 26 -60)`);
    const m = { ok: 'M-16,-202 Q0,-188 16,-202', happy: 'M-22,-206 Q0,-180 22,-206 Z', tired: 'M-16,-196 Q-8,-204 0,-196 Q8,-188 16,-196', wow: 'M-10,-200 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0' }[mood];
    at(p + '-mouth', 'd', m);
    at(p + '-mouth', 'fill', mood === 'happy' ? '#5a1520' : 'none');
    op(p + '-sweat', sweat);
}

// Production machine with gauge eyes and a smokestack.
function machineSVG(p) {
    return `
<g id="${p}">
  <g id="${p}-body">
    <rect class="ink" x="128" y="-470" width="56" height="150" fill="#fff"/>
    <path class="thin" d="M128,-430 L184,-430" fill="none"/>
    <g id="${p}-smoke">${[0, 1, 2].map(i => `<circle id="${p}-sm${i}" class="thin" cx="156" cy="-500" r="26" fill="#fff"/>`).join('')}</g>
    <rect class="ink" x="-190" y="-340" width="380" height="340" rx="26" fill="#fff"/>
    <rect class="ink" x="-160" y="-310" width="320" height="160" rx="18" fill="${NAVY2}"/>
    <circle class="ink" cx="-72" cy="-232" r="52" fill="#fff"/><circle class="ink" cx="72" cy="-232" r="52" fill="#fff"/>
    <path id="${p}-ndL" class="ink" d="M-72,-232 L-72,-270" fill="none" stroke="${ORANGE}"/>
    <path id="${p}-ndR" class="ink" d="M72,-232 L72,-270" fill="none" stroke="${ORANGE}"/>
    <circle cx="-72" cy="-232" r="8" fill="${INK}"/><circle cx="72" cy="-232" r="8" fill="${INK}"/>
    <rect id="${p}-mouth" class="ink" x="-70" y="-120" width="140" height="34" rx="12" fill="#5a1520"/>
    <path class="thin" d="M-46,-120 L-46,-86 M-16,-120 L-16,-86 M16,-120 L16,-86 M46,-120 L46,-86" fill="none"/>
    ${[-160, 160].map(x => `<circle class="thin" cx="${x}" cy="-30" r="8" fill="${ORANGE}"/>`).join('')}
    <circle id="${p}-bulb" class="ink" cx="-120" cy="-366" r="22" fill="${ORANGE2}"/>
    <path class="ink" d="M-120,-344 L-120,-340" fill="none"/>
    <path class="ink" d="M190,-150 L280,-110 L280,-60 L190,-80 Z" fill="${CARD}"/>
  </g>
  <g id="${p}-zzz" opacity="0"><text class="txt" x="-40" y="-400" font-size="64" fill="#fff" stroke="${INK}" stroke-width="5" paint-order="stroke">Zzz</text></g>
</g>`;
}
function poseMachine(p, f, o) {
    const { x, y, s = 1, work = 1, stopped = 0, sq = 1 } = o;
    const shake = work * Math.sin(f * 2.1) * 3;
    tf(p, x + shake, y, s, 0, 1 / Math.sqrt(sq), sq);
    at(p + '-ndL', 'transform', `rotate(${work ? Math.sin(f * .3) * 60 : -50} -72 -232)`);
    at(p + '-ndR', 'transform', `rotate(${work ? Math.cos(f * .27) * 60 : 50} 72 -232)`);
    for (let i = 0; i < 3; i++) {
        const t = ((f * (work ? 1 : 0.25) + i * 20) % 60) / 60;
        at(p + '-sm' + i, 'cy', (-500 - t * 160).toFixed(1));
        at(p + '-sm' + i, 'r', (16 + t * 34).toFixed(1));
        op(p + '-sm' + i, (1 - t) * (work ? 1 : 0.3));
    }
    at(p + '-mouth', 'height', (work ? 34 + Math.abs(Math.sin(f * .4)) * 12 : 10).toFixed(1));
    at(p + '-bulb', 'fill', stopped ? (Math.floor(f / 6) % 2 ? '#ff3b30' : '#ffd0cc') : ORANGE2);
    op(p + '-zzz', stopped);
    if (stopped) at(p + '-zzz', 'transform', `translate(0 ${-((f % 40) / 40) * 30})`);
}

// Cardboard box with a face. mood: happy | worried | panic
function boxSVG(p) {
    return `
<g id="${p}">
  <rect class="ink" x="-46" y="-92" width="92" height="92" rx="8" fill="${CARD}"/>
  <path class="thin" d="M-46,-66 L46,-66 M0,-92 L0,-66" fill="none"/>
  <rect x="-8" y="-92" width="16" height="26" fill="${ORANGE}" opacity=".85"/>
  <circle id="${p}-el" cx="-16" cy="-40" r="6" fill="${INK}"/><circle id="${p}-er" cx="16" cy="-40" r="6" fill="${INK}"/>
  <path id="${p}-m" class="thin" d="M-12,-24 Q0,-14 12,-24" fill="none"/>
</g>`;
}
function poseBox(p, x, y, s, r, mood, f) {
    tf(p, x, y, s, r);
    const m = { happy: 'M-13,-26 Q0,-12 13,-26', worried: 'M-12,-18 Q0,-28 12,-18', panic: 'M-9,-24 a9 7 0 1 0 18 0 a9 7 0 1 0 -18 0' }[mood];
    at(p + '-m', 'd', m);
    const er = mood === 'panic' ? 8 : 6;
    at(p + '-el', 'r', er); at(p + '-er', 'r', er);
}

// Conveyor with spinning rollers. len in px; rollers every 110px.
function conveyorSVG(p, len) {
    const n = Math.floor(len / 110) + 1;
    let r = '';
    for (let i = 0; i < n; i++) {
        const cx = 40 + i * ((len - 80) / (n - 1));
        r += `<g id="${p}-r${i}" transform="translate(${cx.toFixed(1)},-110)"><circle class="ink" r="28" fill="#fff"/><path class="thin" d="M-20,0 L20,0 M0,-20 L0,20" fill="none"/></g>`;
    }
    return `
<g id="${p}">
  <path class="ink" d="M30,-80 L20,0 M${len - 30},-80 L${len - 20},0 M${len / 2},-80 L${len / 2},0" fill="none"/>
  <rect class="ink" x="0" y="-150" width="${len}" height="80" rx="40" fill="${NAVY2}"/>
  ${r}
  <path id="${p}-belt" class="ink" d="M10,-146 L${len - 10},-146" fill="none" stroke-dasharray="26 22" stroke="${ORANGE}"/>
</g>`;
}
function poseConveyor(p, f, x, y, s, speed, len) {
    tf(p, x, y, s);
    const n = Math.floor(len / 110) + 1;
    for (let i = 0; i < n; i++) at(`${p}-r${i}`, 'transform', `translate(${(40 + i * ((len - 80) / (n - 1))).toFixed(1)},-110) rotate(${(f * speed * 6) % 360})`);
    at(p + '-belt', 'stroke-dashoffset', (-f * speed * 3).toFixed(1));
}

// Polaroid with a real company photo, taped to the page.
function photoSVG(p, img, caption) {
    return `
<g id="${p}">
  <rect class="ink" x="-170" y="-130" width="340" height="300" rx="6" fill="#fff"/>
  <image href="../../images/works/${img}" x="-150" y="-110" width="300" height="220" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  <rect class="thin" x="-150" y="-110" width="300" height="220" fill="none"/>
  <text class="txt" x="0" y="148" font-size="28" text-anchor="middle" fill="${INK}">${caption}</text>
  <rect x="-60" y="-148" width="120" height="36" fill="${ORANGE}" opacity=".85" transform="rotate(-4)"/>
</g>`;
}

const clockSVG = p => `
<g id="${p}"><circle class="ink" r="56" fill="#fff"/><path class="thin" d="M0,-44 L0,-36 M44,0 L36,0 M0,44 L0,36 M-44,0 L-36,0" fill="none"/>
<path id="${p}-h" class="ink" d="M0,0 L0,-38" fill="none" stroke="${ORANGE}"/><circle r="7" fill="${INK}"/>
<path class="ink" d="M-40,-50 L-52,-64 M40,-50 L52,-64" fill="none"/></g>`;

const checkSVG = (p, good = true) => `
<g id="${p}"><circle class="ink" r="62" fill="${good ? '#2ecc71' : '#ff3b30'}"/>
<path class="ink" d="${good ? 'M-28,2 L-6,24 L30,-22' : 'M-24,-24 L24,24 M24,-24 L-24,24'}" fill="none" stroke="#fff" stroke-width="14"/></g>`;

const bubbleSVG = (p, text, w = 300, fs = 44) => `
<g id="${p}"><rect class="ink" x="${-w / 2}" y="-60" width="${w}" height="96" rx="40" fill="#fff"/>
<path class="ink" d="M-20,34 L-34,72 L10,36" fill="#fff"/>
<rect x="${-w / 2 + 6}" y="26" width="${w - 12}" height="12" fill="#fff"/>
<text class="txt" x="0" y="4" font-size="${fs}" text-anchor="middle" fill="${INK}">${text}</text></g>`;

const tagSVG = (p, text, fill = ORANGE, color = '#fff', fs = 44) => `
<g id="${p}"><text class="txt" x="0" y="0" font-size="${fs}" text-anchor="middle" fill="${color}" stroke="${INK}" stroke-width="10" paint-order="stroke">${text}</text></g>`;

function burstSVG(p, n = 14, r1 = 70, r2 = 130) {
    let d = '';
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; d += `M${(Math.cos(a) * r1).toFixed(1)},${(Math.sin(a) * r1).toFixed(1)} L${(Math.cos(a) * r2).toFixed(1)},${(Math.sin(a) * r2).toFixed(1)} `; }
    return `<g id="${p}"><path class="ink" d="${d}" fill="none" stroke="${ORANGE}"/></g>`;
}

function gearSVG(p, r, teeth, label, fill) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {
        const a0 = i / (teeth * 2) * Math.PI * 2, a1 = (i + 1) / (teeth * 2) * Math.PI * 2;
        const rr = i % 2 ? r : r + 26;
        d += (i ? 'L' : 'M') + (Math.cos(a0) * rr).toFixed(1) + ',' + (Math.sin(a0) * rr).toFixed(1) + ' L' + (Math.cos(a1) * rr).toFixed(1) + ',' + (Math.sin(a1) * rr).toFixed(1) + ' ';
    }
    return `<g id="${p}"><g id="${p}-rot"><path class="ink" d="${d}Z" fill="${fill}"/><circle class="ink" r="${r * .42}" fill="#fff"/></g>
<text class="txt" y="16" font-size="${Math.round(r * .3)}" text-anchor="middle" fill="${INK}">${label}</text></g>`;
}

// station card used for line maps
const stationSVG = (p, label, w = 200) => `
<g id="${p}"><rect class="ink" x="${-w / 2}" y="-70" width="${w}" height="120" rx="22" fill="#fff"/>
<text class="txt" y="8" font-size="34" text-anchor="middle" fill="${INK}">${label}</text></g>`;

function cardSVG(p, title, icon) {
    return `
<g id="${p}">
  <rect id="${p}-bd" class="ink" x="-165" y="-200" width="330" height="400" rx="30" fill="#fff"/>
  <g transform="translate(0,-40)">${icon}</g>
  <text class="txt" y="150" font-size="34" text-anchor="middle" fill="${INK}">${title}</text>
</g>`;
}

/* ------------------------------------------------------------ the page */
function buildBackground() {
    // A scattered doodle wallpaper in a slightly lighter navy, like the
    // margins of a sketchbook: stars, spirals, bolts, dots and little gears.
    let s = `<rect width="1920" height="1080" fill="${NAVY}"/><g id="bgPat" stroke="#1a3558" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">`;
    for (let i = 0; i < 70; i++) {
        const x = hash(i) * 2200 - 140, y = hash(i + 99) * 1360 - 140, k = Math.floor(hash(i + 7) * 5), r = 14 + hash(i + 3) * 18;

function pileBox(id, k, f, s3from, settle) {
    const spawn = s3from + BOX_DELAY + k * BOX_EVERY;

    poseBox(id, x, y, .95 * (1 + land * .15), lerp(-120, slot[2], t) + (settle ? Math.sin(f * .3 + k) * 2 : 0), mood, f);
    at(id, 'transform', E(id).getAttribute('transform') + ` scale(1,${(1 - land * .3).toFixed(3)})`);
}

/* ------------------------------------------------------- camera & fx */
const CAM = { x: 0, y: 0, z: 1 };
function camera(f) {
    // punch in on the first frames of every spoken line — the "วิบวาบ" beat
    let punch = 0;
    for (const ln of TL.lines) { const d = f - ln.from; if (d >= 0 && d < 14) punch = Math.max(punch, Math.exp(-d / 4) * .04); }
    const z = CAM.z * (1 + punch);
    const dx = CAM.x + Math.sin(f * .013) * 8, dy = CAM.y + Math.cos(f * .011) * 6;
    at('cam', 'transform', `translate(${960 + dx},${540 + dy}) scale(${z.toFixed(4)}) translate(-960,-540)`);
}

function wipe(f) {
    // a wavy orange band with an inked edge sweeps across each scene change
    let html = '';
    for (const s of TL.scenes.slice(1)) {
        const d = f - s.from;
        if (d < -10 || d > 10) continue;
        const t = (d + 10) / 20;
        const x = lerp(-400, 2320, inOut(t));
        let edgeL = '', edgeR = '';
        for (let y = -20; y <= 1100; y += 60) {
            edgeL += `L${(x - 420 + Math.sin(y * .02 + f) * 26).toFixed(0)},${y} `;
            edgeR = `L${(x + Math.sin(y * .021 + f * .8) * 26).toFixed(0)},${y} ` + edgeR;
        }
        html += `<path d="M${x - 420},-20 ${edgeL}${edgeR}Z" fill="${ORANGE}" stroke="${INK}" stroke-width="10"/>`;
        if (Math.abs(d) <= 1) html += `<rect width="1920" height="1080" fill="#fff" opacity="${.35 - Math.abs(d) * .15}"/>`;
    }
    $('wipe').innerHTML = html;
}

function subtitles(f) {
    const i = lineAt(f);
    const el = $('subText');
    if (i < 0 || f > TL.lines[i].to + 6) { el.textContent = ''; el.parentNode.style.opacity = 0; return; }
    const ln = TL.lines[i];
    // split on the breath marks into chunks short enough for one line,
    // then show each chunk for a share of the line proportional to its length
    const words = ln.text.split(' ');
    const chunks = [];
    let cur = '';
    for (const w of words) { if ((cur + ' ' + w).trim().length > 34 && cur) { chunks.push(cur.trim()); cur = w; } else cur += ' ' + w; }
    if (cur.trim()) chunks.push(cur.trim());
    const total = chunks.reduce((a, c) => a + c.length, 0);
    const p = inv(f, ln.from, ln.to) * total;
    let acc = 0, k = 0;
    for (; k < chunks.length - 1; k++) { acc += chunks[k].length; if (p < acc) break; }
    el.textContent = chunks[k];
    el.parentNode.style.opacity = 1;
}

/* ---------------------------------------------------------------- run */
function build() {
    buildBackground();
    $('world').innerHTML = Object.values(SCENES).map(s => s.svg).join('');
}

let lastScene = null;
function render(f) {
    f = clamp(f, 0, TOTAL - 1);
    const sc = TL.scenes.find(s => f >= s.from && f < s.to) || TL.scenes[TL.scenes.length - 1];
    if (sc.id !== lastScene) {
        Object.keys(SCENES).forEach(id => at(id, 'display', id === sc.id ? 'inline' : 'none'));
        lastScene = sc.id;
    }
    CAM.x = 0; CAM.y = 0; CAM.z = 1;
    SCENES[sc.id].render(f - sc.from, f, sc.to - sc.from);
    camera(f);
    // hand-drawn boil: a new noise pattern every 4 frames
    at('boilNoise', 'seed', String(1 + Math.floor(f / 4) % 6));
    at('bgPat', 'transform', `translate(${(-f * .35) % 400},${(-f * .2) % 400})`);
    wipe(f);
    subtitles(f);
}

build();
render(0);
window.__FPS = FPS;
window.__TOTAL = TOTAL;
window.__seek = render;
window.__ready = true;
})();
